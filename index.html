<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>31V 的 AI 团队办公室 · 演示版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%233b2416%22/%3E%3Crect x=%224%22 y=%224%22 width=%228%22 height=%228%22 rx=%222%22 fill=%22%232443a6%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="importmap">

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<body>
<div id="scene"></div>
<header id="topbar">
  <div class="title"><span class="logo">◆</span> <span id="title">31V 的 AI 团队</span><small>3D 办公室</small></div>
  <div class="controls">
    <button id="btnDay" title="昼夜切换">🌙 夜间</button>
    <button id="btnDemo" class="on" title="演示模式">▶ 演示模式：开</button>
    <button id="btnList" class="mobile-only">☰ 成员</button>
  </div>
</header>
<aside id="panel">
  <div class="panel-head">团队状态 <span id="summary"></span></div>
  <div id="legend"></div>
  <div id="rules"></div>
  <ul id="botList"></ul>
</aside>
<div id="card" class="hidden">
  <button id="cardClose" aria-label="关闭">×</button>
  <div class="card-top"><span id="cardDot"></span><div><div id="cardName"></div><div id="cardRole"></div></div></div>
  <div class="card-row"><span>状态</span><b id="cardStatus"></b></div>
  <div class="card-row"><span>当前任务</span><b id="cardTask"></b></div>
  <div id="cardExtra"></div>
</div>
<footer id="footer">演示版 · 状态为模拟数据<span class="credit"> · 窗景照片 <a href="https://commons.wikimedia.org/wiki/File:Tokyo_Minato_Panorama.jpg" target="_blank" rel="noopener">Tokyoship</a> / <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>（已修改）</span></footer>
